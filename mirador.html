<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mirador · Aviario de Chile</title>
<meta name="description" content="Mirador de aves para los binoculares de cartón: elige una región y una zona, gira para buscar aves de 2024, escúchalas y fotografíalas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mirador.css">
</head>
<body class="mirador">
<canvas id="c" aria-label="Mirador de aves en 3D"></canvas>
<svg id="mask" aria-hidden="true"><path fill-rule="evenodd"/></svg>
<div id="eyes"></div>
<div id="flash" class="flash"></div>

<template id="eye-tpl">
  <div class="eye">
    <div class="e-top"><div class="e-place"></div><div class="e-date"></div></div>
    <div class="e-compass"><div class="e-strip"></div><i class="e-needle"></i></div>
    <div class="e-reticle"><i></i></div>
    <div class="e-zoom"></div>
    <div class="e-card" hidden></div>
    <div class="e-toast" hidden></div>
    <div class="e-book" hidden></div>
    <div class="e-menu" hidden></div>
  </div>
</template>

<!-- Pantalla de inicio: se usa con el teléfono fuera de los binoculares -->
<div id="start" class="screen setup">
  <h1>MIRADOR<small>aves de Chile · 2024</small></h1>
  <p class="hint" id="start-status">Cargando datos…</p>
  <div class="setup-box win">
    <label class="row"><input type="checkbox" id="opt-bino"> Vista de binoculares (dos lentes)</label>
    <div id="lens-opts">
      <label class="row">Separación de los lentes <input type="range" id="opt-sep" min="25" max="50" step="0.5"><output id="out-sep"></output></label>
      <label class="row">Tamaño de cada lente <input type="range" id="opt-dia" min="15" max="50" step="0.5"><output id="out-dia"></output></label>
      <p class="dim">Ajusta hasta que cada círculo quede centrado en su tubo (los centros van a 62 mm).</p>
    </div>
    <button class="btn big" id="b-start" disabled>EMPEZAR</button>
    <p class="dim">FOTO (espacio): fotografiar · INFO (enter): ficha · rueda (Z / X): zoom<br>
      Mantener INFO (M): mes siguiente · mantener FOTO (Esc): volver al menú · mirar al suelo: libreta</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module" src="js/mirador.js"></script>
</body>
</html>
